name: Deploy SecCopilot

on:
  workflow_dispatch:
    inputs:
      whatIfOnly:
        description: 'Only run what-if (preview changes, deploy nothing)'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: JLCopilot
      LOCATION: westeurope
      DEPLOYMENT_NAME: CopilotDeployment

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Ensure resource group
        if: ${{ !inputs.whatIfOnly }}
        run: |
          if [ "$(az group exists --name "$RESOURCE_GROUP")" = "true" ]; then
            echo "Resource group $RESOURCE_GROUP already exists."
          else
            az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none
            echo "Created resource group $RESOURCE_GROUP in $LOCATION."
          fi

      - name: What-if
        run: |
          if [ "$(az group exists --name "$RESOURCE_GROUP")" != "true" ]; then
            echo "::notice::Resource group $RESOURCE_GROUP does not exist; a deployment would create it in $LOCATION and create every resource in main.bicep. Skipping what-if."
            exit 0
          fi
          az deployment group what-if \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file ./main.bicep \
            --parameters ./main.bicepparam

      - name: Deploy SecCopilot
        if: ${{ !inputs.whatIfOnly }}
        run: |
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file ./main.bicep \
            --parameters ./main.bicepparam
